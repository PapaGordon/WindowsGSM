name: Build

on:
  push:
    branches: [main]
    paths:
      - 'WindowsGSM/**'
      - 'WindowsGSM-Plugin-Development/**'
      - 'WindowsGSM.sln'
      - '.github/workflows/build.yml'
  pull_request:
    branches: [main]
    paths:
      - 'WindowsGSM/**'
      - 'WindowsGSM-Plugin-Development/**'
      - 'WindowsGSM.sln'
      - '.github/workflows/build.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: '8.0.x'
      - uses: microsoft/setup-msbuild@v3
      - name: Build
        run: msbuild WindowsGSM.sln /restore /p:Configuration=Release /m /nologo
